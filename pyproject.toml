[project]
name = "servicepilot"
version = "0.2.0"
description = "Teaching MVP: after-sales ticket triage assistant"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicepilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
